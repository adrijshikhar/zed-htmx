name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: wasm32-wasip2
          components: clippy, rustfmt

      - name: Rustfmt check
        run: cargo fmt --all --check

      - name: Cargo check
        run: cargo check --target wasm32-wasip2 --release

      - name: Clippy check
        run: cargo clippy --target wasm32-wasip2 --release -- -D warnings

  test:
    name: Host Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Run host tests
        run: cargo test --locked

  pinned:
    name: Pinned Hashes Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter pinned changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            pinned:
              - 'src/pinned.rs'
              - 'scripts/pin-server.sh'

      - name: Verify pinned hashes
        if: steps.filter.outputs.pinned == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/pin-server.sh --check
