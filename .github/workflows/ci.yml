name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: clippy, rustfmt

      - name: Rustfmt check
        run: cargo fmt --all --check

      - name: Cargo check
        run: cargo check --target wasm32-wasip2 --release

      - name: Clippy check
        run: cargo clippy --target wasm32-wasip2 --release -- -D warnings
