id = "htmx"
name = "HTMX"
version = "0.2.0"
schema_version = 1
authors = ["Adrij Shikhar <adrijshikhar@gmail.com>"]
description = "HTMX 2.0 language server integration for Zed, powered by htmx-analyzer."
repository = "https://github.com/adrijshikhar/zed-htmx"

[lib]
kind = "Rust"
version = "0.7.0"

[language_servers.htmx-analyzer]
name = "htmx-analyzer"
languages = ["HTML", "Jinja2", "Django", "PHP", "HTML+ERB", "Blade", "Vue.js", "Astro", "Svelte", "Templ"]

[language_servers.htmx-analyzer.language_ids]
"HTML" = "html"
"Jinja2" = "jinja"
"Django" = "django-html"
"PHP" = "php"
"HTML+ERB" = "erb"
"Blade" = "blade"
"Vue.js" = "vue"
"Astro" = "astro"
"Svelte" = "svelte"
"Templ" = "templ"
